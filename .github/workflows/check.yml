name: Client regression checks

on:
  push:
    branches: [4.0-dev]
  pull_request:
    branches: [4.0-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.5"
      - name: Unit tests and debug build
        run: gradle testDebugUnitTest assembleDebug
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
