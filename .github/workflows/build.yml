name: Release APK

on:
  workflow_dispatch:
  push:
    branches: [4.0-dev]
    tags: ['v*']

permissions:
  contents: read

env:
  EXPECTED_SIGNING_CERT_SHA256: 07a7a780ae0a089543d516a2ada2ff78a6a1a0364f7e1e6eae8582894359196e

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.5'

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.RELEASESTOREPASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASEKEYPASSWORD }}
          KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          values = {name: os.environ.get(name, '') for name in (
              'KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS')}
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit('Incomplete signing configuration: ' + ', '.join(missing))
          encoded = ''.join(values['KEYSTORE_BASE64'].split())
          key_file = Path('release.keystore')
          key_file.write_bytes(base64.b64decode(encoded, validate=True))
          key_file.chmod(0o600)
          certificate = subprocess.run([
              'keytool', '-exportcert', '-keystore', str(key_file),
              '-alias', values['KEY_ALIAS'], '-storepass:env', 'STORE_PASSWORD'],
              capture_output=True)
          if certificate.returncode:
              raise SystemExit('Cannot read signing key; check keystore, alias and password')
          digest = hashlib.sha256(certificate.stdout).hexdigest()
          if digest != os.environ['EXPECTED_SIGNING_CERT_SHA256']:
              raise SystemExit('Signing certificate does not match the Fork release key')

          def property_value(value):
              data = value.encode('utf-16-be')
              return ''.join('\\u%04x' % int.from_bytes(data[i:i + 2], 'big')
                             for i in range(0, len(data), 2))

          properties = {
              'keystore.file': 'release.keystore',
              'keystore.password': values['STORE_PASSWORD'],
              'keystore.key.alias': values['KEY_ALIAS'],
              'keystore.key.password': values['KEY_PASSWORD'],
          }
          properties_file = Path('keystore.properties')
          properties_file.write_text(''.join(
              key + '=' + property_value(value) + '\n'
              for key, value in properties.items()), encoding='ascii')
          properties_file.chmod(0o600)
          mode = 'release'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + mode + '\n')
          print('Signing mode: ' + mode)
          PY

      - name: Unit tests and release build
        run: gradle testDebugUnitTest assembleRelease

      - name: Verify APK and prepare checksums
        id: metadata
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          directory = Path('app/build/outputs/apk/release')
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          checksums = []
          signatures = []
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          for element in metadata['elements']:
              apk = directory / element['outputFile']
              result = subprocess.run(
                  [str(signer), 'verify', '--verbose', '--print-certs', str(apk)],
                  check=True, capture_output=True, text=True)
              digests = re.findall(
                  r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)', result.stdout)
              if {digest.lower() for digest in digests} != {os.environ['EXPECTED_SIGNING_CERT_SHA256']}:
                  raise SystemExit('APK signing certificate does not match the Fork release key')
              signatures.append(apk.name + '\n' + result.stdout)
              with apk.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              checksums.append(digest + '  ' + apk.name + '\n')
          if not checksums:
              raise SystemExit('Release build produced no APKs')
          (directory / 'SHA256SUMS.txt').write_text(''.join(checksums))
          (directory / 'signatures.txt').write_text('\n'.join(signatures))
          print('\n'.join(signatures))
          properties = dict(line.split('=', 1) for line in
                            Path('application.properties').read_text().splitlines()
                            if '=' in line and not line.lstrip().startswith('#'))
          prerelease = properties.get('isPreRelease', 'false').strip().lower() == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prerelease=' + str(prerelease).lower() + '\n')
          PY

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/signatures.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          echo "APK: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing: $SIGNING_MODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing files
        if: always()
        run: rm -f release.keystore keystore.properties

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-mapping-${{ github.run_number }}
          path: mapping
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          body: |
            Commit: ${{ github.sha }}
            Signing: ${{ needs.build.outputs.signing }}
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
            release/signatures.txt
            mapping/mapping.txt
